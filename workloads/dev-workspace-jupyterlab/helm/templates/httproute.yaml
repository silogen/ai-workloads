{{- if .Values.http_route.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "release.fullname" . }}
spec:
  parentRefs:
{{- $parentRefs := .Values.http_route.parentRefs }}
{{- $gatewayNamespace := .Values.http_route.gatewayNamespace | default .Values.http_route.gateway_namespace | default "envoy-gateway-system" }}
{{- if and $parentRefs (kindIs "slice" $parentRefs) (gt (len $parentRefs) 0) }}
{{- range $parentRefs }}
{{- if not (kindIs "map" .) }}{{ fail "http_route.parentRefs[] entries must be maps with name and namespace" }}{{- end }}
{{- if not .name }}{{ fail "http_route.parentRefs[].name is required" }}{{- end }}
{{- if not .namespace }}{{ fail "http_route.parentRefs[].namespace is required" }}{{- end }}
    - group: {{ .group | default "gateway.networking.k8s.io" | quote }}
      name: {{ .name | quote }}
      namespace: {{ .namespace | quote }}
{{- end }}
{{- else if and $parentRefs (not (kindIs "slice" $parentRefs)) }}
{{- fail "http_route.parentRefs must be a list" }}
{{- else }}
    - group: gateway.networking.k8s.io
      name: https
      namespace: {{ $gatewayNamespace | quote }}
{{- end }}
  rules:
    - backendRefs:
        - name:  {{ include "release.fullname" . }}
          port: 80
      matches:
      - path:
          type: PathPrefix
          value: {{ include "httpRoute.baseUrl" . }}
      # filters:
      #   - type: URLRewrite
      #     urlRewrite:
      #       path:
      #         type: ReplacePrefixMatch
      #         replacePrefixMatch: /
{{- end -}}
