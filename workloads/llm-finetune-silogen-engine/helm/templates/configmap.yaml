apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ .Release.Name }}-configs"
data:
  accelerate_config.yaml: |
    {{- if (eq .Values.distributedType "auto-deepspeed-stage1" ) }}
    compute_environment: LOCAL_MACHINE
    distributed_type: DEEPSPEED
    deepspeed_config:
      zero_stage: 1
      bf16:
        enabled: true
    fsdp_config: {}
    machine_rank: 0
    main_process_ip: null
    main_process_port: null
    mixed_precision: bf16
    num_machines: 1
    num_processes: {{ .Values.finetuningGpus }}
    use_cpu: false
    {{- else if (eq .Values.distributedType "auto-deepspeed-stage3") }}
    compute_environment: LOCAL_MACHINE
    distributed_type: DEEPSPEED
    deepspeed_config:
      zero_stage: 3
      bf16:
        enabled: true
      offload_optimizer_device: none
      offload_param_device: none
      zero3_init_flag: true
      zero3_save_16bit_model: true
    fsdp_config: {}
    machine_rank: 0
    main_process_ip: null
    main_process_port: null
    mixed_precision: bf16
    num_machines: 1
    num_processes: {{ .Values.finetuningGpus }}
    use_cpu: false
    {{- else if (eq .Values.distributedType "auto-single-process") }}
    compute_environment: LOCAL_MACHINE
    distributed_type: NO
    fsdp_config: {}
    machine_rank: 0
    main_process_ip: null
    main_process_port: null
    mixed_precision: bf16
    num_machines: 1
    num_processes: 1
    use_cpu: false
    {{- else if (eq .Values.distributedType "auto-ddp") }}
    compute_environment: LOCAL_MACHINE
    debug: false
    distributed_type: MULTI_GPU
    downcast_bf16: 'no'
    enable_cpu_affinity: false
    machine_rank: 0
    main_training_function: main
    mixed_precision: bf16
    num_machines: 1
    num_processes: {{ .Values.finetuningGpus }}
    rdzv_backend: static
    same_network: true
    tpu_env: []
    tpu_use_cluster: false
    tpu_use_sudo: false
    use_cpu: false
    {{- else if (eq .Values.distributedType "custom-accelerate-config") }}
    {{- toYaml .Values.customAccelerateConfig | nindent 4 }}
    {{- end }}
  finetuning_config.yaml: |
    {{- with .Values.finetuning_config }}
    method: {{ .method }}
    data_conf:
      training_data:
        type: {{ .data_conf.training_data.type }}
        datasets:
          {{- $get_train_sampling_weight := (eq .data_conf.training_data.type "PRECOMPUTE_WEIGHTED_MIX") }}
          {{- range .data_conf.training_data.datasets }}
          - path: /local_resources/{{ .path | replace "/" "_" }}
          {{- if $get_train_sampling_weight }}
            sampling_weight: {{ default 1.0 .sampling_weight }}
          {{- end }}
          {{- end }}
      validation_data:
        type: {{ .data_conf.validation_data.type }}
        {{- if (eq .data_conf.validation_data.type "AUTO_SPLIT") }}
        ratio: {{ .data_conf.validation_data.ratio }}
        {{- else if (eq .validation_data_type "CONCATENATION") }}
        datasets:
          {{- range .data_conf.validation_data.datasets }}
          - path: /local_resources/{{ .path | replace "/" "_" }}
          {{- end }}
        {{- end }}
      chat_template_name: {{ .data_conf.chat_template_name }}
      missing_pad_token_strategy: {{ .data_conf.missing_pad_token_strategy }}
    training_args:
      {{- toYaml .training_args | nindent 6 }}
    overrides:
      {{- toYaml .overrides | nindent 6 }}
    batchsize_conf:
      total_train_batch_size: {{ default $.Values.finetuningGpus .batchsize_conf.total_train_batch_size }}
      max_per_device_train_batch_size: {{ .batchsize_conf.max_per_device_train_batch_size }}
      per_device_eval_batch_size: {{ default "null" .batchsize_conf.per_device_eval_batch_size }}
    peft_conf:
      {{- toYaml .peft_conf | nindent 6 }}
    quant_conf:
      {{- toYaml .quant_conf | nindent 6 }}
    run_conf:
      model: /local_resources/basemodel
      final_checkpoint_name: {{ ternary "checkpoint-final" "checkpoint-final-adapter" (eq .peft_conf.peft_type "NO_PEFT") }}
      {{- toYaml .run_conf | nindent 6 }}
    {{- if (eq .method "sft") }}
    sft_args:
      {{- toYaml .sft_args | nindent 6 }}
    {{- end }}
    {{- if .tracking }}
    tracking:
      {{- toYaml .tracking | nindent 6 }}
    {{- end }}
    {{- end }}
  {{- if .Values.aimManifest.modelManifest.enabled }}
  {{- $isPeft := ne .Values.finetuning_config.peft_conf.peft_type "NO_PEFT" }}
  {{- if and $isPeft (not .Values.mergeAdapter) }}
    {{- fail "aimManifest.modelManifest.enabled requires either a full parameter finetune (peft_type: NO_PEFT) or adapter merging enabled (mergeAdapter: true). Currently using PEFT without merging, which produces only an adapter, not a complete model." }}
  {{- end }}
  aim-model-manifest.yaml: |
    apiVersion: aim.eai.amd.com/v1alpha2
    kind: AIMModel
    metadata:
      name: {{ required "aimManifest.modelManifest.modelName is required when aimManifest.modelManifest.enabled is true!" .Values.aimManifest.modelManifest.modelName | quote }}
      {{- include "validateResourceName" .Values.aimManifest.modelManifest.modelName }}
      {{- if .Values.aimManifest.modelManifest.labels }}
      labels:
        {{- range $key, $value := .Values.aimManifest.modelManifest.labels }}
        {{ $key }}: {{ $value | quote }}
        {{- end }}
      {{- end }}
      {{- if .Values.aimManifest.modelManifest.annotations }}
      annotations:
        {{- range $key, $value := .Values.aimManifest.modelManifest.annotations }}
        {{ $key }}: {{ $value | quote }}
        {{- end }}
      {{- end }}
    spec:
      # Profiles are derived from a base-image AIMModel in the same namespace: the
      # AIM controller copies that model's discovered profiles and overlays this
      # model's identity and fine-tuned weights. A base derivation requires aimId
      # and modelId in overrides because the base profiles carry no identity.
      profiles:
        derivedFrom:
          selector:
            role: {{ .Values.aimManifest.modelManifest.profilesRole | quote }}
            modelRef:
              name: {{ .Values.aimManifest.modelManifest.baseModel.name | quote }}
              scope: {{ .Values.aimManifest.modelManifest.baseModel.scope | quote }}
        versionPolicy: all
        overrides:
          {{- if not .Values.aimManifest.modelManifest.aimId }}
          {{- fail "aimManifest.modelManifest.aimId is required when aimManifest.modelManifest.enabled is true (v1alpha2 base derivation stamps identity via overrides)!" }}
          {{- end }}
          aimId: {{ .Values.aimManifest.modelManifest.aimId | quote }}
          modelId: {{ required "aimManifest.modelManifest.modelId is required when aimManifest.modelManifest.enabled is true!" .Values.aimManifest.modelManifest.modelId | quote }}
          {{- if .Values.aimManifest.modelManifest.image }}
          image: {{ .Values.aimManifest.modelManifest.image | quote }}
          {{- end }}
          modelSources:
            - modelId: {{ .Values.aimManifest.modelManifest.modelId | quote }}
              sourceUri: "s3://{{ .Values.checkpointsRemote }}/checkpoint-final"
              env:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.bucketCredentialsSecret.name | quote }}
                      key: {{ .Values.bucketCredentialsSecret.accessKeyKey | quote }}
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.bucketCredentialsSecret.name | quote }}
                      key: {{ .Values.bucketCredentialsSecret.secretKeyKey | quote }}
                - name: AWS_ENDPOINT_URL
                  value: {{ .Values.bucketStorageHost | quote }}
  {{- end }}
  {{- if .Values.aimManifest.adapterManifest.enabled }}
  {{- if eq .Values.finetuning_config.peft_conf.peft_type "NO_PEFT" }}
    {{- fail "aimManifest.adapterManifest.enabled requires a PEFT/LoRA finetune (finetuning_config.peft_conf.peft_type must not be NO_PEFT). A full parameter finetune produces no adapter to deploy." }}
  {{- end }}
  adapter-cr-manifest.yaml: |
    apiVersion: aim.eai.amd.com/v1alpha1
    kind: AIMArtifact
    metadata:
      name: {{ required "aimManifest.adapterManifest.adapterName is required when aimManifest.adapterManifest.enabled is true!" .Values.aimManifest.adapterManifest.adapterName | quote }}
      labels:
        app.kubernetes.io/managed-by: fine-tuning
        {{- range $key, $value := .Values.aimManifest.adapterManifest.labels }}
        {{ $key }}: {{ $value | quote }}
        {{- end }}
      {{- if .Values.aimManifest.adapterManifest.annotations }}
      annotations:
        {{- range $key, $value := .Values.aimManifest.adapterManifest.annotations }}
        {{ $key }}: {{ $value | quote }}
        {{- end }}
      {{- end }}
    spec:
      type: adapter
      modelId: {{ required "aimManifest.adapterManifest.organisation is required when aimManifest.adapterManifest.enabled is true!" .Values.aimManifest.adapterManifest.organisation }}/{{ .Values.aimManifest.adapterManifest.adapterName }}
      compatibleWith:
        - {{ .Values.model | quote }}
      sourceUri: "s3://{{ required "checkpointsRemote is required when aimManifest.adapterManifest.enabled is true!" .Values.checkpointsRemote }}/checkpoint-final-adapter"
      rank: {{ required "finetuning_config.peft_conf.peft_kwargs.r is required when aimManifest.adapterManifest.enabled is true! Set the LoRA rank (r) in the training configuration." .Values.finetuning_config.peft_conf.peft_kwargs.r }}
      env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: {{ .Values.bucketCredentialsSecret.name | quote }}
              key: {{ .Values.bucketCredentialsSecret.accessKeyKey | quote }}
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.bucketCredentialsSecret.name | quote }}
              key: {{ .Values.bucketCredentialsSecret.secretKeyKey | quote }}
        - name: AWS_ENDPOINT_URL
          value: {{ .Values.bucketStorageHost | quote }}
  adapter-manifest.yaml: |
    modelId: {{ required "aimManifest.adapterManifest.organisation is required when aimManifest.adapterManifest.enabled is true!" .Values.aimManifest.adapterManifest.organisation }}/{{ .Values.aimManifest.adapterManifest.adapterName }}
    compatibleWith:
      - {{ .Values.model | quote }}
    rank: {{ required "finetuning_config.peft_conf.peft_kwargs.r is required when aimManifest.adapterManifest.enabled is true! Set the LoRA rank (r) in the training configuration." .Values.finetuning_config.peft_conf.peft_kwargs.r }}
    displayName: {{ .Values.aimManifest.adapterManifest.displayName | quote }}
    description: {{ .Values.aimManifest.adapterManifest.description | quote }}
  {{- end }}
