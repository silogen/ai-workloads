{{- define "deployment" -}}
{{- /* Chart-owned variables: reject rather than let a duplicate entry win and
       point the server at a different port than the Service targets. */}}
{{- range $reserved := list "COMFYUI_PORT" "COMFYUI_CKPT_MATCH" }}
{{- if hasKey (default dict $.Values.env_vars) $reserved }}
{{- fail (printf "env_vars.%s is set by the chart from deployment.ports.http and model; remove it from env_vars" $reserved) }}
{{- end }}
{{- end }}
{{- /* Readiness requires the checkpoint this release asked for, identified by
       `tag`. Left empty when there is no Hugging Face model to wait for, which
       readiness treats as "the server answering is enough": the s3 path has
       already copied its model before the server starts, and a workspace with
       no model gets one from the ComfyUI-Manager UI. */}}
{{- $ckptMatch := "" }}
{{- if and .Values.model .Values.tag (not (hasPrefix "s3://" (toString .Values.model))) }}
{{- $ckptMatch = toString .Values.tag }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "release.fullname" . }}
  labels:
    app: {{ include "release.fullname" . }}
    {{- range $key, $value := .Values.metadata.labels }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "release.fullname" . }}
  template:
    metadata:
      annotations:
        {{- range $key, $value := .Values.metadata.annotations }}
        {{ $key }}: {{ tpl $value $ | quote }}
        {{- end }}
      labels:
        app: {{ include "release.fullname" . }}
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range .Values.imagePullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          args:
          - |
            {{- include "entrypoint" . | nindent 12 }}
          command: ["sh", "-c"]
          env:
            - name: COMFYUI_PORT
              value: {{ .Values.deployment.ports.http | quote }}
            - name: COMFYUI_CKPT_MATCH
              value: {{ $ckptMatch | quote }}
            {{- if .Values.env_vars }}
            {{- include "container.env" . | nindent 12 }}
            {{- end }}
          image: {{ .Values.image | quote}}
          imagePullPolicy: {{ default "Always" .Values.imagePullPolicy | quote }}
          {{- if .Values.livenessProbe }}
          livenessProbe:
            {{- .Values.livenessProbe | toYaml | nindent 12 -}}
          {{- end }}
          ports:
            {{- range $key, $value := .Values.deployment.ports }}
            - name: {{ $key }}
              containerPort: {{ $value }}
            {{- end }}
          {{- if .Values.readinessProbe }}
          readinessProbe:
            {{- .Values.readinessProbe | toYaml | nindent 12 -}}
          {{- end }}
          resources:
            {{- include "container.resources" . | nindent 12 }}
          {{- if .Values.startupProbe }}
          startupProbe:
            {{- .Values.startupProbe | toYaml | nindent 12 -}}
          {{- end }}
          volumeMounts:
            {{- include "container.volumeMounts" . | nindent 12 }}
      volumes:
        {{- include "container.volumes" . | nindent 8 }}
{{- end -}}

{{- define "deployment_stripped" -}}
{{- $deployment := include "deployment" . | fromYaml }}
{{- $ := unset $deployment "metadata" }}
{{- $ := unset $deployment.spec.template "metadata" }}
{{- $deployment | toYaml }}
{{- end -}}

{{- define "deployment_wrapped_with_kaiwoservice" -}}
apiVersion: kaiwo.silogen.ai/v1alpha1
kind: KaiwoService
metadata:
  name: {{ include "release.fullname" . }}
  labels:
    app: {{ include "release.fullname" . }}
    {{- range $key, $value := .Values.metadata.labels }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
spec:
  deployment:
    {{- include "deployment" . | nindent 4 }}
{{- end -}}

{{- if .Values.kaiwo.enabled -}}
{{- include "deployment_wrapped_with_kaiwoservice" . }}
{{- else -}}
{{- include "deployment" . }}
{{- end -}}
