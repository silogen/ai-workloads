name: Common

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  run-pre-commit-checks:
    runs-on:
      - cpu
      - self-hosted-cpu

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Helm
        shell: bash
        run: |
          # helmlint shells out to helm, which is not on every self-hosted runner.
          TOOL_BIN="${RUNNER_TEMP}/bin"
          mkdir -p "$TOOL_BIN"
          echo "$TOOL_BIN" >> "$GITHUB_PATH"

          curl -fsSL https://get.helm.sh/helm-v3.18.6-linux-amd64.tar.gz \
            | tar -xzf - -C "$TOOL_BIN" --strip-components=1 linux-amd64/helm
          chmod +x "$TOOL_BIN/helm"

      - name: Check style with pre-commit
        run: pip install pre-commit && pre-commit run --all-files
